[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "slerobot"
version = "0.1.0"
description = "SLeRobot - Simplified LeRobot Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "sLeRobot Team"}
]
dependencies = [
    "draccus>=0.8.0",
    "paho-mqtt>=1.6.1",
    "numpy>=1.20",
    "opencv-python>=4.5",
    "pillow>=9.0",
    "pyyaml>=5.4",
    "pyzmq>=25.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["slerobot*"]

[project.scripts]
slerobot-record = "slerobot.scripts.slerobot_record:record"
slerobot-lekiwi-record = "slerobot.scripts.slerobot_lekiwi_record:record"
slerobot-lekiwi-host = "slerobot.robots.lekiwi.lekiwi_host:main"
